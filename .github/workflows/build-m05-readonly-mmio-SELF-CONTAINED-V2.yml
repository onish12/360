name: Build PHASER360 M0.5 read-only MMIO - self contained

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-m05-readonly-mmio-SELF-CONTAINED-V2.yml'

permissions:
  contents: read

jobs:
  build:
    name: x64 M0.5 read-only MMIO
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Generate pinned M0.5 source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE

          $files = @{
            'm05\driver\phaser360_m05_mmio_ro.cpp' = ''
            'm05\driver\phaser360_m05_mmio_ro.inf' = ''
            'm05\driver\phaser360_m05_mmio_ro.vcxproj' = ''
            'm05\runtime\RUN_M05.ps1' = ''
            'm05\runtime\VERIFY_PACKAGE.ps1' = ''
            'm05\RUN_M05_AFTER_BUILD_TEMPLATE.cmd' = ''
            'm05\Directory.Build.props' = ''
            'm05\packages.config' = ''
            'm05\README.md' = ''
            'm05\SOURCE_LEDGER.md' = ''
          }

          $expected = @{
            'm05\driver\phaser360_m05_mmio_ro.cpp' = '0b830451aa59f71caf580f658c6dafd029813b37617394b3629c18bcc7964c73'
            'm05\driver\phaser360_m05_mmio_ro.inf' = 'adcef2fd9bcd7792bfcf6971859fbe86e477d6592004ac3ed5a027e424530efd'
            'm05\driver\phaser360_m05_mmio_ro.vcxproj' = '2aa003b7d4ca5da178d69aa87ab7581b1974c7e78a5002fd62df5639f09f9f1a'
            'm05\runtime\RUN_M05.ps1' = 'cd42056bfebbb798bc98b780120bf447962c0002856ae866515fb9184f31f4a5'
            'm05\runtime\VERIFY_PACKAGE.ps1' = '34fa6b473dbc8a7512183d0c5347d4c8a873a3069f249fa61ceb849b6eeb255b'
            'm05\RUN_M05_AFTER_BUILD_TEMPLATE.cmd' = '3360325e1a50b237ff54e004af4fa50dbb2009abff5ee8cf43ff0d62a781c6a3'
            'm05\Directory.Build.props' = 'f821bb2334ba4ec362e2b74f68f30e50c6b17f9c3d5bb95ff55a8eb73d1efb28'
            'm05\packages.config' = '541695c5bcc393ab6711fbbbe694baba4d67cc30a67c694baaeb53dff48aca22'
            'm05\README.md' = '8435e42f0ddaa079da03b339be08feadc7e063bf4bbd88e7ed85e0194d54a504'
            'm05\SOURCE_LEDGER.md' = '33696d9613d70f3c682f225e505beac61b469769d958e26dfa2413b4a0467e6e'
          }

          foreach ($relative in $files.Keys) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $parent = Split-Path -Parent $path
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            $bytes = [Convert]::FromBase64String($files[$relative])
            [IO.File]::WriteAllBytes($path, $bytes)
          }

          foreach ($relative in $expected.Keys) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Generated file missing: $relative"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$relative]) {
              throw "Generated file hash mismatch: $relative"
            }
          }

          "PHASER_SOURCE_ROOT=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "M05_ROOT=$(Join-Path $env:GITHUB_WORKSPACE 'm05')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "M05_DRIVER_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'm05\driver')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Host "GENERATED_FILES=$($files.Count)"
          Write-Host 'GENERATE_SOURCE_TREE=PASS'

      - name: Runner and toolchain preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 2

          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"

          $msbuild = Get-Command msbuild.exe -ErrorAction Stop
          $nuget = Get-Command nuget.exe -ErrorAction Stop

          Write-Host "MSBUILD=$($msbuild.Source)"
          Write-Host "NUGET=$($nuget.Source)"

          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Unexpected runner: $env:RUNNER_OS/$env:RUNNER_ARCH"
          }

          Write-Host 'TOOLCHAIN_PREFLIGHT=PASS'


      - name: Static source safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT
          $src = Get-Content '.\m05\driver\phaser360_m05_mmio_ro.cpp' -Raw
          $inf = Get-Content '.\m05\driver\phaser360_m05_mmio_ro.inf' -Raw

          $required = @(
            'MmMapIoSpaceEx',
            'PAGE_READONLY | PAGE_NOCACHE',
            'READ_REGISTER_UCHAR',
            'READ_REGISTER_USHORT',
            'READ_REGISTER_ULONG',
            'MmUnmapIoSpace',
            'PHASER_EXPECTED_HDA_PHYS 0x00000000CEEE0000ull',
            'PHASER_EXPECTED_DSP_PHYS 0x00000000CEF00000ull',
            'PHASER_EXPECTED_HDA_LEN  0x00004000u',
            'PHASER_EXPECTED_DSP_LEN  0x00100000u'
          )
          foreach ($token in $required) {
            if (-not $src.Contains($token)) { throw "Missing M0.5 safety token: $token" }
          }

          $forbidden = @(
            'WRITE_REGISTER_',
            'WdfInterruptCreate',
            'WdfDma',
            'EvtDeviceD0Entry',
            'EvtDeviceD0Exit',
            'WdfDeviceStopIdle',
            'WdfDeviceResumeIdle',
            'KeStallExecutionProcessor',
            'MmAllocateContiguousMemory',
            'MmAllocatePagesForMdl',
            'PrepareDSP',
            'TriggerDSP',
            'SetDSPPowerState'
          )
          foreach ($token in $forbidden) {
            if ($src.Contains($token)) { throw "Forbidden M0.5 token exists: $token" }
          }

          $ids = [regex]::Matches($inf, 'PCI\\VEN_8086&DEV_[0-9A-Fa-f]{4}[^\r\n]*')
          if ($ids.Count -ne 1 -or
              $ids[0].Value.Trim() -ne 'PCI\VEN_8086&DEV_3198&SUBSYS_00000000&REV_06') {
            throw 'INF is not hard-bound to the exact audited DEV_3198 target.'
          }

          if (-not $inf.Contains('StartType=3')) {
            throw 'M0.5 service must be demand-start.'
          }

          Write-Host 'STATIC_SOURCE_SAFETY=PASS'

      - name: Restore Microsoft WDK and SDK NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT
          nuget restore '.\m05\packages.config' -PackagesDirectory '.\m05\packages' -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet WDK restore failed: $LASTEXITCODE" }

          foreach ($required in @(
            '.\m05\packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props',
            '.\m05\packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props',
            '.\m05\packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props'
          )) {
            if (-not (Test-Path $required)) { throw "Required build props missing: $required" }
          }
          Write-Host 'WDK_NUGET_RESTORE=PASS'

      - name: Build with Microsoft WDK NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT
          msbuild '.\m05\driver\phaser360_m05_mmio_ro.vcxproj' /m /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:KMDF_VERSION_MAJOR=1 `
            /p:KMDF_VERSION_MINOR=33 `
            /p:TargetVersion=Windows10 `
            /p:SignMode=Off `
            /verbosity:minimal

          $sys = '.\m05\driver\out\phaser360_m05_mmio_ro.sys'
          if (-not (Test-Path $sys)) { throw "SYS not generated: $sys" }
          Copy-Item $sys '.\m05\driver\phaser360_m05_mmio_ro.sys' -Force
          Write-Host 'BUILD=PASS'

      - name: Locate WDK tools and validate built package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT

          function Find-Tool([string]$Name) {
            $cmd = Get-Command $Name -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }

            $candidates = @()
            foreach ($base in @(
              (Join-Path $env:PHASER_SOURCE_ROOT 'm05\packages'),
              "$env:USERPROFILE\.nuget\packages",
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            )) {
              if (Test-Path $base) {
                $candidates += @(Get-ChildItem $base -Recurse -File -Filter $Name -ErrorAction SilentlyContinue)
              }
            }

            $preferred = @($candidates | Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending)
            if ($preferred.Count -gt 0) { return $preferred[0].FullName }

            $any = @($candidates | Sort-Object FullName -Descending)
            if ($any.Count -gt 0) { return $any[0].FullName }

            throw "Tool not found: $Name"
          }

          $infverif = Find-Tool 'infverif.exe'
          $signtool = Find-Tool 'signtool.exe'

          "INFVERIF=$infverif" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $stampedInf = '.\m05\driver\obj\phaser360_m05_mmio_ro.inf'
          $generatedCat = '.\m05\driver\out\phaser360_m05_mmio_ro\phaser360_m05_mmio_ro.cat'
          $builtSys = '.\m05\driver\phaser360_m05_mmio_ro.sys'

          foreach ($required in @($stampedInf,$generatedCat,$builtSys)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "WDK build output missing: $required"
            }
          }

          # Use the exact stamped INF that MSBuild used when it generated the catalog.
          Copy-Item -LiteralPath $stampedInf `
            -Destination '.\m05\driver\phaser360_m05_mmio_ro.inf' -Force

          # Use the exact catalog generated by the successful MSBuild/WDK signability target.
          Copy-Item -LiteralPath $generatedCat `
            -Destination '.\m05\driver\phaser360_m05_mmio_ro.cat' -Force

          & $infverif /w '.\m05\driver\phaser360_m05_mmio_ro.inf'
          if ($LASTEXITCODE -ne 0) { throw "InfVerif failed: $LASTEXITCODE" }

          Write-Host "INFVERIF=$infverif"
          Write-Host "SIGNTOOL=$signtool"
          Write-Host 'MSBUILD_GENERATED_CAT=PASS'
          Write-Host 'STAMPED_INF_COLLECT=PASS'
          Write-Host 'INFVERIF=PASS'

      - name: Create ephemeral test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT

          $subject = 'CN=PHASER360 M0.5 Test Signing'
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -HashAlgorithm SHA256 `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddYears(2)

          if (-not $cert -or -not $cert.HasPrivateKey) {
            throw 'Could not create M0.5 test certificate.'
          }

          Export-Certificate -Cert $cert `
            -FilePath '.\m05\PHASER360_M05_TEST_SIGNING.cer' `
            -Type CERT | Out-Null

          $cert.Thumbprint | Set-Content '.\m05\CERT_THUMBPRINT.txt' -Encoding ascii

          # Do NOT embedded-sign the SYS here. MSBuild already created the catalog
          # over these exact SYS/INF bytes. Changing SYS now would invalidate its
          # catalog thumbprint. This is a demand-start PnP driver, not boot-start.
          Write-Host 'TEST_CERT_CREATE=PASS'
          Write-Host 'SYS_BYTES_AFTER_CATALOG=UNCHANGED'

      - name: Sign MSBuild-generated catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT

          $cat = '.\m05\driver\phaser360_m05_mmio_ro.cat'
          $sys = '.\m05\driver\phaser360_m05_mmio_ro.sys'
          $inf = '.\m05\driver\phaser360_m05_mmio_ro.inf'

          foreach ($required in @($cat,$sys,$inf)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Driver-package component missing: $required"
            }
          }

          # Record component hashes immediately before CAT signing.
          $sysBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath $sys).Hash
          $infBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath $inf).Hash

          $thumb = (Get-Content '.\m05\CERT_THUMBPRINT.txt' -Raw).Trim()
          & $env:SIGNTOOL sign /v /fd SHA256 /sha1 $thumb /s My $cat
          if ($LASTEXITCODE -ne 0) { throw 'CAT signing failed.' }

          $sysAfter = (Get-FileHash -Algorithm SHA256 -LiteralPath $sys).Hash
          $infAfter = (Get-FileHash -Algorithm SHA256 -LiteralPath $inf).Hash
          if ($sysAfter -ne $sysBefore -or $infAfter -ne $infBefore) {
            throw 'SYS or INF changed while signing CAT.'
          }

          Write-Host 'CAT_TEST_SIGN=PASS'
          Write-Host 'SYS_INF_HASH_STABILITY=PASS'

      - name: Binary safety audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT

          $dumpbinCmd = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbinCmd) {
            $dumpbin = $dumpbinCmd.Source
          }
          else {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path -LiteralPath $vswhere)) {
              throw "vswhere.exe not found: $vswhere"
            }

            $vsRoot = (& $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath | Select-Object -First 1)

            if (-not $vsRoot) {
              throw 'Visual Studio installation with VC x64 tools was not found.'
            }

            $dumpbinFile = Get-ChildItem `
              (Join-Path $vsRoot 'VC\Tools\MSVC') `
              -Recurse -File -Filter 'dumpbin.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $dumpbinFile) {
              throw "dumpbin.exe not found under Visual Studio: $vsRoot"
            }

            $dumpbin = $dumpbinFile.FullName
          }

          Write-Host "DUMPBIN=$dumpbin"
          $sys = '.\m05\driver\phaser360_m05_mmio_ro.sys'
          $imports = (& $dumpbin /imports $sys | Out-String)
          $imports | Set-Content '.\m05\BINARY_IMPORTS.txt' -Encoding ascii

          foreach ($forbidden in @(
            'WRITE_REGISTER_',
            'WdfInterruptCreate',
            'WdfDma',
            'MmAllocateContiguousMemory',
            'MmAllocatePagesForMdl'
          )) {
            if ($imports.Contains($forbidden)) {
              throw "Compiled binary imports forbidden API: $forbidden"
            }
          }

          if (-not $imports.Contains('MmMapIoSpaceEx') -or
              -not $imports.Contains('MmUnmapIoSpace')) {
            throw 'Compiled binary is missing required MMIO map/unmap imports.'
          }

          $srcHash = (Get-FileHash '.\m05\driver\phaser360_m05_mmio_ro.cpp' -Algorithm SHA256).Hash
          $sysHash = (Get-FileHash $sys -Algorithm SHA256).Hash
          "SOURCE_SHA256=$srcHash" | Set-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          "SYS_SHA256=$sysHash" | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'DEVICE_MMIO_WRITES=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'DSP_POWER_WRITES=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'INTERRUPT_OBJECT=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'DMA=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'FIRMWARE=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'IPC=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'AUDIO_STREAM=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii

          Write-Host 'BINARY_SAFETY_AUDIT=PASS'

      - name: Verify signatures and package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:PHASER_SOURCE_ROOT

          Write-Host 'M05_RUNTIME_TEMPLATE=START'
          Copy-Item '.\m05\RUN_M05_AFTER_BUILD_TEMPLATE.cmd' '.\m05\RUN_M05.cmd' -Force
          Write-Host 'M05_RUNTIME_TEMPLATE=PASS'
          $thumb = (Get-Content '.\m05\CERT_THUMBPRINT.txt' -Raw).Trim()

          # PowerShell's certificate provider can stall on this hosted runner.
          # Use the native Windows certificate-store utility for the same current-user
          # Root trust operation required by SignTool's Authenticode policy check.
          $certPath = (Resolve-Path '.\m05\PHASER360_M05_TEST_SIGNING.cer').Path
          Write-Host 'M05_TRUST_ROOT=START'
          & certutil.exe -user -f -addstore Root $certPath
          if ($LASTEXITCODE -ne 0) {
            throw "certutil could not add the test certificate to CurrentUser Root: $LASTEXITCODE"
          }
          Write-Host 'M05_TRUST_ROOT=PASS'

          $cat = '.\m05\driver\phaser360_m05_mmio_ro.cat'
          $inf = '.\m05\driver\phaser360_m05_mmio_ro.inf'
          $sys = '.\m05\driver\phaser360_m05_mmio_ro.sys'

          Write-Host 'M05_VERIFY_CAT_SIGNATURE=START'
          & $env:SIGNTOOL verify /v /pa $cat
          if ($LASTEXITCODE -ne 0) { throw 'CAT signature verification failed.' }
          Write-Host 'M05_VERIFY_CAT_SIGNATURE=PASS'

          Write-Host 'M05_VERIFY_INF_MEMBERSHIP=START'
          & $env:SIGNTOOL verify /v /pa /c $cat $inf
          if ($LASTEXITCODE -ne 0) { throw 'INF catalog membership/signature verification failed.' }
          Write-Host 'M05_VERIFY_INF_MEMBERSHIP=PASS'

          Write-Host 'M05_VERIFY_SYS_MEMBERSHIP=START'
          & $env:SIGNTOOL verify /v /pa /c $cat $sys
          if ($LASTEXITCODE -ne 0) { throw 'SYS catalog membership/signature verification failed.' }
          Write-Host 'M05_VERIFY_SYS_MEMBERSHIP=PASS'

          Write-Host 'CAT_SIGNATURE=PASS'
          Write-Host 'INF_CATALOG_MEMBERSHIP=PASS'
          Write-Host 'SYS_CATALOG_MEMBERSHIP=PASS'

          Remove-Item '.\m05\CERT_THUMBPRINT.txt' -Force -ErrorAction SilentlyContinue

          # Build inputs/intermediates stay in place; copy only the approved runtime payload
          # into a small stage tree. This avoids recursively deleting or archiving WDK NuGet.
          Write-Host 'M05_ARTIFACT_STAGE=START'
          $m05Root = (Resolve-Path '.\m05').Path
          $artifactStage = Join-Path $env:GITHUB_WORKSPACE '_artifact_m05'
          $stageRoot = Join-Path $artifactStage 'm05'
          Remove-Item -LiteralPath $artifactStage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageRoot -Force | Out-Null

          & robocopy $m05Root $stageRoot /E /XD `
            (Join-Path $m05Root 'packages') `
            (Join-Path $m05Root 'driver\out') `
            (Join-Path $m05Root 'driver\obj') *> $null
          $copyExit = $LASTEXITCODE
          Write-Host ("ROBOCOPY_EXIT=" + $copyExit)
          if ($copyExit -gt 7) {
            throw "Artifact-stage copy failed: robocopy exit code $copyExit"
          }

          foreach ($excluded in @('packages', 'driver\out', 'driver\obj')) {
            if (Test-Path -LiteralPath (Join-Path $stageRoot $excluded)) {
              throw "Excluded build directory leaked into artifact stage: $excluded"
            }
          }
          Write-Host 'ARTIFACT_STAGE_EXCLUSIONS=PASS'
          Write-Host 'M05_ARTIFACT_STAGE=PASS'

          $manifest = Join-Path $stageRoot 'SHA256SUMS.txt'
          if (Test-Path -LiteralPath $manifest) { Remove-Item -LiteralPath $manifest -Force }

          $payload = @(Get-ChildItem -LiteralPath $stageRoot -Recurse -File)
          if ($payload.Count -eq 0) {
            throw 'No artifact payload files were staged.'
          }
          $payloadBytes = [Int64](($payload | Measure-Object -Property Length -Sum).Sum)
          if ($payloadBytes -gt 52428800) {
            throw "Artifact payload unexpectedly exceeds 50 MiB: $payloadBytes bytes"
          }
          Write-Host ("ARTIFACT_PAYLOAD_BYTES=" + $payloadBytes)

          $payload |
            Sort-Object FullName |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $rel = $_.FullName.Substring($stageRoot.Length + 1)
              "$h  $rel" | Add-Content -LiteralPath $manifest -Encoding ascii
            }

          $artifactZip = Join-Path $env:GITHUB_WORKSPACE 'PHASER360_M05_READONLY_MMIO.zip'
          Write-Host 'M05_ARCHIVE=START'
          Compress-Archive -Path (Join-Path $stageRoot '*') `
            -DestinationPath $artifactZip -Force
          Write-Host 'M05_ARCHIVE=PASS'

          if (-not (Test-Path -LiteralPath $artifactZip)) {
            throw "Artifact ZIP was not created: $artifactZip"
          }

          Write-Host ("ARTIFACT_ZIP=" + $artifactZip)
          Write-Host 'PACKAGE=PASS'

      - name: Upload M0.5
        uses: actions/upload-artifact@v7
        with:
          name: PHASER360_M05_READONLY_MMIO
          path: PHASER360_M05_READONLY_MMIO.zip
          if-no-files-found: error

