name: M0.6 SOF firmware parser - OFFLINE ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/sof/**'
      - 'tools/sof_inspect.cpp'
      - 'tests/sof_firmware_tests.cpp'
      - 'tests/fixtures/sof_glk_reference.json'
      - 'scripts/verify-sof-reference.py'
      - 'CMakeLists.txt'
      - '.github/workflows/test-m06-sof-firmware.yml'
  pull_request:
    paths:
      - 'src/sof/**'
      - 'tools/sof_inspect.cpp'
      - 'tests/**'
      - 'scripts/verify-sof-reference.py'
      - 'CMakeLists.txt'
      - '.github/workflows/test-m06-sof-firmware.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Offline parser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitizers: 'ON'
          - os: windows-2025
            sanitizers: 'OFF'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure user-mode tests (not the WDK driver)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'phaser360-m06-build'
          $flags = @('-S', '.', '-B', $build, '-DCMAKE_BUILD_TYPE=Debug', '-DPHASER_SOF_SANITIZERS=${{ matrix.sanitizers }}')
          if ($env:RUNNER_OS -eq 'Windows') { $flags += @('-A', 'x64') }
          & cmake @flags
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Compile with warnings as errors
        shell: pwsh
        run: |
          cmake --build "$env:RUNNER_TEMP/phaser360-m06-build" --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Offline parser build failed.' }

      - name: Unit tests and deterministic malformed-input tests
        shell: pwsh
        run: |
          ctest --test-dir "$env:RUNNER_TEMP/phaser360-m06-build" -C Debug --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Offline parser unit tests failed.' }

      - name: Hash-pinned official APL/GLK fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'phaser360-m06-build'
          $binary = Join-Path $build 'phaser360_sof_inspect'
          if ($env:RUNNER_OS -eq 'Windows') { $binary = Join-Path $build 'Debug/phaser360_sof_inspect.exe' }
          python scripts/verify-sof-reference.py --inspector $binary --fixture "$build/fixtures/sof-apl.ri" --download --report "$build/REFERENCE_CHECK.json"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SOF reference validation failed.' }

      - name: Stage development artifact (no firmware and no driver installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'phaser360-m06-build'
          $stage = Join-Path $env:RUNNER_TEMP 'phaser360-m06-artifact'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$build/REFERENCE_CHECK.json", 'docs/M06_FIRMWARE.md', 'LICENSE' $stage
          Copy-Item 'tests/fixtures/sof_glk_reference.json' $stage
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item "$build/Debug/phaser360_sof_inspect.exe", "$build/Debug/phaser360_sof_parser.lib" $stage
          } else {
            # Linux binary is a sanitizer-instrumented development executable.
            Copy-Item "$build/phaser360_sof_inspect", "$build/libphaser360_sof_parser.a" $stage
          }
          "COMMIT=$env:GITHUB_SHA`nHARDWARE_ACCESS=NONE`nINSTALLABLE=FALSE`nAUDIO_OUTPUT=NONE" | Set-Content "$stage/BUILD_STATUS.txt"
          $files = @(Get-ChildItem $stage -File | Sort-Object Name)
          $manifest = @($files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          })
          $manifest | Set-Content "$stage/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PHASER360_M06_OFFLINE_${{ runner.os }}
          path: ${{ runner.temp }}/phaser360-m06-artifact/
          if-no-files-found: error
          retention-days: 30
