name: M0.6 SOF firmware parser - OFFLINE ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/sof/**'
      - 'm062/driver/**'
      - 'tests/fake_wdf/**'
      - 'tools/sof_inspect.cpp'
      - 'tests/sof*'
      - 'tests/fixtures/sof_glk_reference.json'
      - 'scripts/verify-sof-reference.py'
      - 'scripts/generate-embedded-firmware.py'
      - 'tests/sof_embedded_firmware_tests.cpp'
      - 'CMakeLists.txt'
      - 'docs/M06_FIRMWARE.md'
      - 'docs/M061_BOOT_PROTOCOL.md'
      - '.github/workflows/test-m06-sof-firmware.yml'
  pull_request:
    paths:
      - 'src/sof/**'
      - 'm062/driver/**'
      - 'tests/fake_wdf/**'
      - 'tools/sof_inspect.cpp'
      - 'tests/**'
      - 'scripts/verify-sof-reference.py'
      - 'scripts/generate-embedded-firmware.py'
      - 'tests/sof_embedded_firmware_tests.cpp'
      - 'CMakeLists.txt'
      - 'docs/M06_FIRMWARE.md'
      - 'docs/M061_BOOT_PROTOCOL.md'
      - '.github/workflows/test-m06-sof-firmware.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Offline parser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitizers: 'ON'
          - os: windows-2025
            sanitizers: 'OFF'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure user-mode tests (not the WDK driver)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'phaser360-m06-build'
          $flags = @('-S', '.', '-B', $build, '-DCMAKE_BUILD_TYPE=Debug', '-DPHASER_SOF_SANITIZERS=${{ matrix.sanitizers }}')
          if ($env:RUNNER_OS -eq 'Windows') { $flags += @('-A', 'x64') }
          & cmake @flags
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Compile with warnings as errors
        shell: pwsh
        run: |
          cmake --build "$env:RUNNER_TEMP/phaser360-m06-build" --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Offline parser build failed.' }

      - name: Unit tests and deterministic malformed-input tests
        shell: pwsh
        run: |
          ctest --test-dir "$env:RUNNER_TEMP/phaser360-m06-build" -C Debug --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Offline parser unit tests failed.' }

      - name: Hash-pinned official APL/GLK fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'phaser360-m06-build'
          $binary = Join-Path $build 'phaser360_sof_inspect'
          if ($env:RUNNER_OS -eq 'Windows') { $binary = Join-Path $build 'Debug/phaser360_sof_inspect.exe' }
          python scripts/verify-sof-reference.py --inspector $binary --fixture "$build/fixtures/sof-apl.ri" --download --report "$build/REFERENCE_CHECK.json"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SOF reference validation failed.' }
          $ipc = Join-Path $build 'phaser360_ipc_tests'
          if ($env:RUNNER_OS -eq 'Windows') { $ipc = Join-Path $build 'Debug/phaser360_ipc_tests.exe' }
          & $ipc "$build/fixtures/sof-apl.ri"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned XMan window validation failed.' }
          if ($env:RUNNER_OS -eq 'Windows') {
            & "$build/Debug/phaser360_cng_pin_tests.exe" "$build/fixtures/sof-apl.ri"
            if ($LASTEXITCODE -ne 0) { throw 'Real CNG firmware pin validation failed.' }
            & "$build/Debug/phaser360_pinned_reference_tests.exe" "$build/fixtures/sof-apl.ri"
            if ($LASTEXITCODE -ne 0) { throw 'Owned firmware reference validation failed.' }
          }

      - name: Generate and verify H7 embedded firmware provider
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'phaser360-m06-build'
          $fixture = Join-Path $build 'fixtures/sof-apl.ri'
          $generated = Join-Path $build 'generated/embedded_firmware.cpp'
          $report = Join-Path $build 'H7_EMBEDDED_FIRMWARE_REPORT.json'

          python scripts/generate-embedded-firmware.py --input $fixture --output $generated --report $report
          if ($LASTEXITCODE -ne 0) { throw 'H7_PROVIDER_GENERATION_FAILED' }

          $bad = Join-Path $build 'fixtures/sof-apl-mutated.ri'
          [IO.File]::WriteAllBytes($bad,[IO.File]::ReadAllBytes($fixture))
          $bytes=[IO.File]::ReadAllBytes($bad)
          $bytes[0]=$bytes[0] -bxor 1
          [IO.File]::WriteAllBytes($bad,$bytes)
          python scripts/generate-embedded-firmware.py --input $bad --output "$generated.bad.cpp"
          if ($LASTEXITCODE -eq 0) { throw 'H7_MUTATED_FIXTURE_MUST_BE_REJECTED' }
          Remove-Item $bad -Force

          cmake -S . -B $build -DPHASER_EMBEDDED_FIRMWARE_CPP="$generated"
          if ($LASTEXITCODE -ne 0) { throw 'H7_RECONFIGURE_FAILED' }
          cmake --build $build --config Debug --target phaser360_embedded_firmware_tests
          if ($LASTEXITCODE -ne 0) { throw 'H7_BUILD_FAILED' }
          ctest --test-dir $build -C Debug -R '^h7_embedded_firmware$' -V
          if ($LASTEXITCODE -ne 0) { throw 'H7_TEST_FAILED' }

      - name: Stage development artifact (no firmware and no driver installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'phaser360-m06-build'
          $stage = Join-Path $env:RUNNER_TEMP 'phaser360-m06-artifact'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$build/REFERENCE_CHECK.json", 'docs/M06_FIRMWARE.md', 'docs/M061_BOOT_PROTOCOL.md', 'LICENSE' $stage
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item "$build/H7_EMBEDDED_FIRMWARE_REPORT.json" $stage
          }
          Copy-Item 'src/sof/boot_sequence.h', 'src/sof/ipc3_ready.h', 'src/sof/firmware_image.h', 'src/sof/hda_bdl.h' $stage
          Copy-Item 'tests/fixtures/sof_glk_reference.json' $stage
          if ($env:RUNNER_OS -eq 'Windows') {
            Copy-Item "$build/Debug/phaser360_sof_inspect.exe", "$build/Debug/phaser360_sof_parser.lib", "$build/Debug/phaser360_sof_boot.lib" $stage
          } else {
            # Linux binary is a sanitizer-instrumented development executable.
            Copy-Item "$build/phaser360_sof_inspect", "$build/libphaser360_sof_parser.a", "$build/libphaser360_sof_boot.a" $stage
          }
          "COMMIT=$env:GITHUB_SHA`nHARDWARE_ACCESS=NONE`nINSTALLABLE=FALSE`nAUDIO_OUTPUT=NONE`nBOOT_BACKEND=TEST_DOUBLE_ONLY`nWINDOWS_DMA_MEMORY=SEPARATE_WDK_COMPONENT_NOT_INTEGRATED`nIPC_WINDOWS=SEPARATE_WDK_COMPONENT" | Set-Content "$stage/BUILD_STATUS.txt"
          $files = @(Get-ChildItem $stage -File | Sort-Object Name)
          $manifest = @($files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          })
          $manifest | Set-Content "$stage/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PHASER360_M06_OFFLINE_${{ runner.os }}
          path: ${{ runner.temp }}/phaser360-m06-artifact/
          if-no-files-found: error
          retention-days: 30
