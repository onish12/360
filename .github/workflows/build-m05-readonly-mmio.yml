name: Build PHASER360 M0.5 read-only MMIO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: x64 M0.5 read-only MMIO
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Static source safety gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content '.\m05\driver\phaser360_m05_mmio_ro.cpp' -Raw
          $inf = Get-Content '.\m05\driver\phaser360_m05_mmio_ro.inf' -Raw

          $required = @(
            'MmMapIoSpaceEx',
            'PAGE_READONLY | PAGE_NOCACHE',
            'READ_REGISTER_UCHAR',
            'READ_REGISTER_USHORT',
            'READ_REGISTER_ULONG',
            'MmUnmapIoSpace',
            'PHASER_EXPECTED_HDA_PHYS 0x00000000CEEE0000ull',
            'PHASER_EXPECTED_DSP_PHYS 0x00000000CEF00000ull',
            'PHASER_EXPECTED_HDA_LEN  0x00004000u',
            'PHASER_EXPECTED_DSP_LEN  0x00100000u'
          )
          foreach ($token in $required) {
            if (-not $src.Contains($token)) { throw "Missing M0.5 safety token: $token" }
          }

          $forbidden = @(
            'WRITE_REGISTER_',
            'WdfInterruptCreate',
            'WdfDma',
            'EvtDeviceD0Entry',
            'EvtDeviceD0Exit',
            'WdfDeviceStopIdle',
            'WdfDeviceResumeIdle',
            'KeStallExecutionProcessor',
            'MmAllocateContiguousMemory',
            'MmAllocatePagesForMdl',
            'PrepareDSP',
            'TriggerDSP',
            'SetDSPPowerState'
          )
          foreach ($token in $forbidden) {
            if ($src.Contains($token)) { throw "Forbidden M0.5 token exists: $token" }
          }

          $ids = [regex]::Matches($inf, 'PCI\\VEN_8086&DEV_[0-9A-Fa-f]{4}[^\r\n]*')
          if ($ids.Count -ne 1 -or
              $ids[0].Value.Trim() -ne 'PCI\VEN_8086&DEV_3198&SUBSYS_00000000&REV_06') {
            throw 'INF is not hard-bound to the exact audited DEV_3198 target.'
          }

          if (-not $inf.Contains('StartType=3')) {
            throw 'M0.5 service must be demand-start.'
          }

          Write-Host 'STATIC_SOURCE_SAFETY=PASS'

      - name: Restore Microsoft WDK and SDK NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore '.\m05\packages.config' -PackagesDirectory '.\m05\packages' -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet WDK restore failed: $LASTEXITCODE" }

          foreach ($required in @(
            '.\m05\packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props',
            '.\m05\packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props',
            '.\m05\packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props'
          )) {
            if (-not (Test-Path $required)) { throw "Required build props missing: $required" }
          }
          Write-Host 'WDK_NUGET_RESTORE=PASS'

      - name: Build with Microsoft WDK NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild '.\m05\driver\phaser360_m05_mmio_ro.vcxproj' /m /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:KMDF_VERSION_MAJOR=1 `
            /p:KMDF_VERSION_MINOR=33 `
            /p:TargetVersion=Windows10 `
            /p:SignMode=Off `
            /verbosity:minimal

          $sys = '.\m05\driver\out\phaser360_m05_mmio_ro.sys'
          if (-not (Test-Path $sys)) { throw "SYS not generated: $sys" }
          Copy-Item $sys '.\m05\driver\phaser360_m05_mmio_ro.sys' -Force
          Write-Host 'BUILD=PASS'

      - name: Locate WDK tools and InfVerif
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Tool([string]$Name) {
            $cmd = Get-Command $Name -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }

            foreach ($base in @(
              "$env:USERPROFILE\.nuget\packages",
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            )) {
              if (Test-Path $base) {
                $hit = Get-ChildItem $base -Recurse -File -Filter $Name -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\x64\\' } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            throw "Tool not found: $Name"
          }

          $infverif = Find-Tool 'infverif.exe'
          $inf2cat = Find-Tool 'inf2cat.exe'
          $signtool = Find-Tool 'signtool.exe'

          "INFVERIF=$infverif" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INF2CAT=$inf2cat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & $infverif /w '.\m05\driver\phaser360_m05_mmio_ro.inf'
          if ($LASTEXITCODE -ne 0) { throw "InfVerif failed: $LASTEXITCODE" }
          Write-Host 'INFVERIF=PASS'

      - name: Create ephemeral test certificate and sign SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $subject = 'CN=PHASER360 M0.5 Test Signing'
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -HashAlgorithm SHA256 `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddYears(2)

          if (-not $cert -or -not $cert.HasPrivateKey) {
            throw 'Could not create M0.5 test certificate.'
          }

          Export-Certificate -Cert $cert `
            -FilePath '.\m05\PHASER360_M05_TEST_SIGNING.cer' `
            -Type CERT | Out-Null

          $cert.Thumbprint | Set-Content '.\m05\CERT_THUMBPRINT.txt' -Encoding ascii

          & $env:SIGNTOOL sign /v /fd SHA256 /sha1 $cert.Thumbprint /s My `
            '.\m05\driver\phaser360_m05_mmio_ro.sys'
          if ($LASTEXITCODE -ne 0) { throw 'SYS signing failed.' }

          Write-Host 'SYS_TEST_SIGN=PASS'

      - name: Generate and sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverDir = (Resolve-Path '.\m05\driver').Path

          & $env:INF2CAT "/driver:$driverDir" '/os:10_NI_X64' /uselocaltime /verbose
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed: $LASTEXITCODE" }

          $thumb = (Get-Content '.\m05\CERT_THUMBPRINT.txt' -Raw).Trim()
          & $env:SIGNTOOL sign /v /fd SHA256 /sha1 $thumb /s My `
            '.\m05\driver\phaser360_m05_mmio_ro.cat'
          if ($LASTEXITCODE -ne 0) { throw 'CAT signing failed.' }

          Write-Host 'CAT_TEST_SIGN=PASS'

      - name: Binary safety audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $sys = '.\m05\driver\phaser360_m05_mmio_ro.sys'
          $imports = (& $dumpbin /imports $sys | Out-String)
          $imports | Set-Content '.\m05\BINARY_IMPORTS.txt' -Encoding ascii

          foreach ($forbidden in @(
            'WRITE_REGISTER_',
            'WdfInterruptCreate',
            'WdfDma',
            'MmAllocateContiguousMemory',
            'MmAllocatePagesForMdl'
          )) {
            if ($imports.Contains($forbidden)) {
              throw "Compiled binary imports forbidden API: $forbidden"
            }
          }

          if (-not $imports.Contains('MmMapIoSpaceEx') -or
              -not $imports.Contains('MmUnmapIoSpace')) {
            throw 'Compiled binary is missing required MMIO map/unmap imports.'
          }

          $srcHash = (Get-FileHash '.\m05\driver\phaser360_m05_mmio_ro.cpp' -Algorithm SHA256).Hash
          $sysHash = (Get-FileHash $sys -Algorithm SHA256).Hash
          "SOURCE_SHA256=$srcHash" | Set-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          "SYS_SHA256=$sysHash" | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'DEVICE_MMIO_WRITES=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'DSP_POWER_WRITES=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'INTERRUPT_OBJECT=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'DMA=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'FIRMWARE=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'IPC=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii
          'AUDIO_STREAM=NONE' | Add-Content '.\m05\BUILD_AUDIT.txt' -Encoding ascii

          Write-Host 'BINARY_SAFETY_AUDIT=PASS'

      - name: Verify signatures and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thumb = (Get-Content '.\m05\CERT_THUMBPRINT.txt' -Raw).Trim()

          Import-Certificate -FilePath '.\m05\PHASER360_M05_TEST_SIGNING.cer' `
            -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath '.\m05\PHASER360_M05_TEST_SIGNING.cer' `
            -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null

          & $env:SIGNTOOL verify /v /pa '.\m05\driver\phaser360_m05_mmio_ro.sys'
          if ($LASTEXITCODE -ne 0) { throw 'SYS signature verification failed.' }

          & $env:SIGNTOOL verify /v /pa /c '.\m05\driver\phaser360_m05_mmio_ro.cat' `
            '.\m05\driver\phaser360_m05_mmio_ro.inf'
          if ($LASTEXITCODE -ne 0) { throw 'CAT membership/signature verification failed.' }

          Remove-Item -Recurse -Force '.\m05\driver\out' -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force '.\m05\driver\obj' -ErrorAction SilentlyContinue
          Remove-Item '.\m05\CERT_THUMBPRINT.txt' -Force -ErrorAction SilentlyContinue

          $manifest = '.\m05\SHA256SUMS.txt'
          if (Test-Path $manifest) { Remove-Item $manifest -Force }

          Get-ChildItem '.\m05' -Recurse -File |
            Where-Object { $_.FullName -ne (Resolve-Path '.\m05').Path + '\SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $rel = $_.FullName.Substring((Resolve-Path '.\m05').Path.Length + 1)
              "$h  $rel" | Add-Content $manifest -Encoding ascii
            }

          Compress-Archive -Path '.\m05\*' `
            -DestinationPath '.\PHASER360_M05_READONLY_MMIO.zip' -Force

          Write-Host 'PACKAGE=PASS'

      - name: Upload M0.5
        uses: actions/upload-artifact@v7
        with:
          name: PHASER360_M05_READONLY_MMIO
          path: PHASER360_M05_READONLY_MMIO.zip
          if-no-files-found: error
