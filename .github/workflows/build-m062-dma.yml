name: M0.6.6 GLK IPC command transport - NOT INSTALLABLE
on:
  workflow_dispatch:
  push:
    paths:
      - 'm062/**'
      - 'src/sof/hda_bdl*'
      - 'src/sof/hda_stream*'
      - 'src/sof/glk_rom*'
      - 'src/sof/ipc3*'
      - 'tests/sof_*tests.cpp'
      - 'tests/sof_ipc_fixture.h'
      - 'tests/fake_wdf/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-m062-dma.yml'
  pull_request:
    paths:
      - 'm062/**'
      - 'src/sof/hda_bdl*'
      - 'src/sof/hda_stream*'
      - 'src/sof/glk_rom*'
      - 'src/sof/ipc3*'
      - 'tests/sof_*tests.cpp'
      - 'tests/sof_ipc_fixture.h'
      - 'tests/fake_wdf/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-m062-dma.yml'
permissions:
  contents: read
jobs:
  wdk:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Compile kernel library against real WDK and KMDF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore .\m062\packages.config -PackagesDirectory .\m062\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE_FAILED' }
          msbuild .\m062\driver\phaser360_boot_dma.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:KMDF_VERSION_MAJOR=1 /p:KMDF_VERSION_MINOR=33 /p:TargetVersion=Windows10 /p:SignMode=Off /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'WDK_COMPILE_FAILED' }
          if (-not (Test-Path .\m062\driver\out\phaser360_boot_dma.lib)) { throw 'LIBRARY_MISSING' }
          Write-Host 'WDK_DMA_LIBRARY=PASS'
      - name: Test descriptor boundaries and allocation failure cleanup
        shell: pwsh
        run: |
          cmake -S . -B build-dma -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CONFIGURE_FAILED' }
          cmake --build build-dma --config Release --target phaser360_bdl_tests phaser360_dma_owner_tests phaser360_stream_tests phaser360_rom_tests phaser360_glk_boot_tests phaser360_ipc_tests phaser360_command_tests
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
          ctest --test-dir build-dma -C Release -R 'sof_(bdl|dma_owner|stream|rom|glk_boot|ipc|command)' -V
          if ($LASTEXITCODE -ne 0) { throw 'TEST_FAILED' }
      - name: Stage development library
        shell: pwsh
        run: |
          New-Item -ItemType Directory _artifact_m062 | Out-Null
          Copy-Item m062/driver/out/phaser360_boot_dma.lib _artifact_m062/
          Copy-Item m062/driver/boot_dma.h,m062/driver/boot_dma.cpp,src/sof/hda_bdl.h,src/sof/hda_bdl.cpp,src/sof/hda_stream.h,src/sof/hda_stream.cpp,m062/driver/hda_transport.h,m062/driver/hda_transport.cpp,docs/M062_WINDOWS_DMA.md,docs/M063_HDA_TRANSPORT.md,src/sof/glk_rom.h,src/sof/glk_rom.cpp,m062/driver/glk_boot.h,m062/driver/glk_boot.cpp,docs/M064_GLK_ROM.md,src/sof/ipc3_ready.h,src/sof/ipc3_ready.cpp,src/sof/ipc3_receive.h,src/sof/ipc3_receive.cpp,docs/M065_IPC_READY.md,src/sof/ipc3_command.h,src/sof/ipc3_command.cpp,docs/M066_IPC_COMMAND.md _artifact_m062/
          @("COMMIT=$env:GITHUB_SHA",'WDK_COMPILE=PASS','INSTALLABLE=FALSE','HARDWARE_EXECUTION=NOT_TESTED','DMA_MEMORY_COMPONENT=IMPLEMENTED','HDA_STREAM_MMIO=IMPLEMENTED_UNTESTED_ON_HARDWARE','ROM_POWER_SEQUENCE=IMPLEMENTED_UNTESTED_ON_HARDWARE','IPC_READY=IMPLEMENTED_UNTESTED_ON_HARDWARE','IPC_COMMAND=IMPLEMENTED_UNTESTED_ON_HARDWARE','AUDIO_PLAYBACK=NOT_IMPLEMENTED','TEST_BACKEND=WDF_SHIM') | Set-Content _artifact_m062/BUILD_STATUS.txt
          Get-ChildItem _artifact_m062 -File | Sort-Object Name | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } | Set-Content _artifact_m062/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PHASER360_M066_WDK_IPC_COMMAND
          path: _artifact_m062/
          if-no-files-found: error
