name: M0.6.15F4 CfgMgr allocated IRQ evidence - NOT INSTALLABLE
on:
  workflow_dispatch:
  push:
    paths:
      - 'm062/**'
      - 'src/sof/hda_bdl*'
      - 'src/sof/hda_stream*'
      - 'src/sof/glk_rom*'
      - 'src/sof/ipc3*'
      - 'tests/sof_*tests.cpp'
      - 'tests/m0615_live_irq_tests.ps1'
      - 'tests/sof_ipc_fixture.h'
      - 'tests/fake_wdf/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-m062-dma.yml'
  pull_request:
    paths:
      - 'm062/**'
      - 'src/sof/hda_bdl*'
      - 'src/sof/hda_stream*'
      - 'src/sof/glk_rom*'
      - 'src/sof/ipc3*'
      - 'tests/sof_*tests.cpp'
      - 'tests/m0615_live_irq_tests.ps1'
      - 'tests/sof_ipc_fixture.h'
      - 'tests/fake_wdf/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-m062-dma.yml'
permissions:
  contents: read
jobs:
  wdk:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Compile kernel library against real WDK and KMDF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore .\m062\packages.config -PackagesDirectory .\m062\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE_FAILED' }
          msbuild .\m062\driver\phaser360_boot_dma.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:KMDF_VERSION_MAJOR=1 /p:KMDF_VERSION_MINOR=33 /p:TargetVersion=Windows10 /p:SignMode=Off /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'WDK_COMPILE_FAILED' }
          if (-not (Test-Path .\m062\driver\out\phaser360_boot_dma.lib)) { throw 'LIBRARY_MISSING' }
          Write-Host 'WDK_DMA_LIBRARY=PASS'
      - name: Test descriptor boundaries and allocation failure cleanup
        shell: pwsh
        run: |
          cmake -S . -B build-dma -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CONFIGURE_FAILED' }
          cmake --build build-dma --config Release --target phaser360_pnp_resources_tests phaser360_pinned_owner_tests phaser360_cng_pin_tests phaser360_bdl_tests phaser360_dma_owner_tests phaser360_stream_tests phaser360_rom_tests phaser360_glk_boot_tests phaser360_ipc_tests phaser360_command_tests
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
          ctest --test-dir build-dma -C Release -R 'sof_(pnp_resources|pinned_owner|cng_pin|bdl|dma_owner|stream|rom|glk_boot|ipc|command)' -V
          if ($LASTEXITCODE -ne 0) { throw 'TEST_FAILED' }
      - name: Verify read-only live IRQ collector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_live_irq_tests.ps1
          if (-not $?) { throw 'IRQ_CAPTURE_STATIC_TESTS_FAILED' }
      - name: Stage development library
        shell: pwsh
        run: |
          New-Item -ItemType Directory _artifact_m062 | Out-Null
          Copy-Item m062/driver/out/phaser360_boot_dma.lib _artifact_m062/
          Copy-Item m062/driver/boot_dma.h,m062/driver/boot_dma.cpp,m062/driver/cm_resource_abi.cpp,src/sof/hda_bdl.h,src/sof/hda_bdl.cpp,src/sof/hda_stream.h,src/sof/hda_stream.cpp,m062/driver/hda_transport.h,m062/driver/hda_transport.cpp,docs/M062_WINDOWS_DMA.md,docs/M063_HDA_TRANSPORT.md,src/sof/glk_rom.h,src/sof/glk_rom.cpp,m062/driver/glk_boot.h,m062/driver/glk_boot.cpp,docs/M064_GLK_ROM.md,src/sof/ipc3_ready.h,src/sof/ipc3_ready.cpp,src/sof/ipc3_receive.h,src/sof/ipc3_receive.cpp,docs/M065_IPC_READY.md,src/sof/ipc3_command.h,src/sof/ipc3_command.cpp,docs/M066_IPC_COMMAND.md,docs/M067_IPC_NOTIFICATIONS.md,m062/driver/ipc_interrupt.h,m062/driver/ipc_interrupt.cpp,docs/M068_KMDF_INTERRUPTS.md,m062/driver/cold_power.h,m062/driver/cold_power.cpp,docs/M069_COLD_POWER.md,docs/M0610_D0_REBIND.md,docs/M0611_DEFERRED_DRAIN.md,m062/driver/firmware_pin.h,m062/driver/firmware_pin.cpp,m062/driver/pinned_firmware.h,m062/driver/pinned_firmware.cpp,docs/M0612_PINNED_FIRMWARE.md,m062/driver/pnp_resources.h,m062/driver/pnp_resources.cpp,m062/driver/hardware_access_gate.h,m051/driver/resource_contract.h,docs/M0613_PNP_RESOURCES.md,docs/M0614_IRQ_EXIT.md,docs/M0615_ACCESS_FENCE.md,docs/M0615_PNP_RESOURCE_BUNDLE.md,docs/M0615_SURPRISE_CALLBACK.md,docs/M0615_POWER_SKELETON.md,docs/M0615_IRQ_INVENTORY.md,docs/M0615_LIVE_IRQ_EVIDENCE.md _artifact_m062/
          New-Item -ItemType Directory _artifact_m062/live_irq | Out-Null
          Copy-Item m062/live_irq/Collect-IrqEvidence.ps1,m062/live_irq/COLLECT_IRQ_EVIDENCE.cmd,m062/live_irq/START_AICI.txt _artifact_m062/live_irq/
          @("COMMIT=$env:GITHUB_SHA",'WDK_COMPILE=PASS','INSTALLABLE=FALSE','HARDWARE_EXECUTION=NOT_TESTED','DMA_MEMORY_COMPONENT=IMPLEMENTED','HDA_STREAM_MMIO=IMPLEMENTED_UNTESTED_ON_HARDWARE','ROM_POWER_SEQUENCE=IMPLEMENTED_UNTESTED_ON_HARDWARE','IPC_READY=IMPLEMENTED_UNTESTED_ON_HARDWARE','IPC_COMMAND=IMPLEMENTED_UNTESTED_ON_HARDWARE','IPC_NOTIFICATIONS=BOUNDED_POLLING_FIFO','IPC_INTERRUPT=DIRQL_ISR_DPC_PASSIVE_WORKITEM_UNTESTED_ON_HARDWARE','COLD_POWER=GUARDED_D0_REBIND_NOT_PNP_DRIVER','DEFERRED_DRAIN=WDF_DPC_CANCEL_THEN_WORKITEM_FLUSH','FIRMWARE_IDENTITY=OWNED_SHA256_PIN_NOT_DEPLOYMENT_APPROVAL','PNP_RESOURCES=PREPARE_RELEASE_ONLY_NO_DSP_BOOT','IRQ_FAILURE_EXIT=ADMISSION_GATE_AND_D0_DISCONNECT_FALLBACK','HARDWARE_ACCESS_FENCE=TERMINAL_AFTER_SURPRISE_REMOVAL','PNP_RESOURCE_BUNDLE=PAIRED_RAW_TRANSLATED_IRQ_SELECTION_DEFERRED','SURPRISE_REMOVAL=FRAMEWORK_CALLBACK_TERMINAL_GATE','PNP_POWER_SKELETON=D0_CALLBACK_ORDER_NO_HARDWARE','IRQ_INVENTORY=LINE_AND_MESSAGE_NO_SELECTION','LIVE_IRQ_CAPTURE=WIN10_CFGMGR_ALLOC_LOG_CONF_OR_WIN11_PNPUTIL_READ_ONLY','AUDIO_PLAYBACK=NOT_IMPLEMENTED','TEST_BACKEND=WDF_SHIM') | Set-Content _artifact_m062/BUILD_STATUS.txt
          Get-ChildItem _artifact_m062 -File | Sort-Object Name | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } | Set-Content _artifact_m062/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PHASER360_M0615F4_CFGMGR_READONLY_IRQ_CAPTURE
          path: _artifact_m062/
          if-no-files-found: error
