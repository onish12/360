name: M0.6.15H13 exact-target INF signability - NOT INSTALLABLE
on:
  workflow_dispatch:
  push:
    paths:
      - 'm062/**'
      - 'src/sof/hda_bdl*'
      - 'src/sof/hda_stream*'
      - 'src/sof/glk_rom*'
      - 'src/sof/ipc3*'
      - 'tests/sof_*tests.cpp'
      - 'tests/m0615_live_irq_tests.ps1'
      - 'tests/m0615_h6_owner_tests.ps1'
      - 'tests/m0615_h7_firmware_source_tests.ps1'
      - 'tests/m0615_h8_link_only_tests.ps1'
      - 'tests/m0615_h9_pe_audit_tests.ps1'
      - 'tests/m0615_h10_repro_tests.ps1'
      - 'tests/m0615_h11_telemetry_tests.ps1'
      - 'tests/m0615_h12_preflight_tests.ps1'
      - 'tests/m0615_h12_1_win10_kmdf_tests.ps1'
      - 'tests/m0615_h13_package_tests.ps1'
      - 'scripts/audit-pe-repro.py'
      - 'scripts/generate-embedded-firmware.py'
      - 'tests/sof_ipc_fixture.h'
      - 'tests/fake_wdf/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-m062-dma.yml'
  pull_request:
    paths:
      - 'm062/**'
      - 'src/sof/hda_bdl*'
      - 'src/sof/hda_stream*'
      - 'src/sof/glk_rom*'
      - 'src/sof/ipc3*'
      - 'tests/sof_*tests.cpp'
      - 'tests/m0615_live_irq_tests.ps1'
      - 'tests/m0615_h6_owner_tests.ps1'
      - 'tests/m0615_h7_firmware_source_tests.ps1'
      - 'tests/m0615_h8_link_only_tests.ps1'
      - 'tests/m0615_h9_pe_audit_tests.ps1'
      - 'tests/m0615_h10_repro_tests.ps1'
      - 'tests/m0615_h11_telemetry_tests.ps1'
      - 'tests/m0615_h12_preflight_tests.ps1'
      - 'tests/m0615_h12_1_win10_kmdf_tests.ps1'
      - 'tests/m0615_h13_package_tests.ps1'
      - 'scripts/audit-pe-repro.py'
      - 'scripts/generate-embedded-firmware.py'
      - 'tests/sof_ipc_fixture.h'
      - 'tests/fake_wdf/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-m062-dma.yml'
permissions:
  contents: read
jobs:
  wdk:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Compile kernel library against real WDK and KMDF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore .\m062\packages.config -PackagesDirectory .\m062\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'RESTORE_FAILED' }
          msbuild .\m062\driver\phaser360_boot_dma.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:KMDF_VERSION_MAJOR=1 /p:KMDF_VERSION_MINOR=31 /p:TargetVersion=Windows10 /p:SignMode=Off /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'WDK_COMPILE_FAILED' }
          if (-not (Test-Path .\m062\driver\out\phaser360_boot_dma.lib)) { throw 'LIBRARY_MISSING' }
          Write-Host 'WDK_DMA_LIBRARY=PASS'
      - name: Test descriptor boundaries and allocation failure cleanup
        shell: pwsh
        run: |
          cmake -S . -B build-dma -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CONFIGURE_FAILED' }
          cmake --build build-dma --config Release --target phaser360_pnp_resources_tests phaser360_pinned_owner_tests phaser360_telemetry_tests phaser360_cng_pin_tests phaser360_bdl_tests phaser360_dma_owner_tests phaser360_stream_tests phaser360_rom_tests phaser360_glk_boot_tests phaser360_ipc_tests phaser360_command_tests phaser360_sof_inspect
          if ($LASTEXITCODE -ne 0) { throw 'BUILD_FAILED' }
          ctest --test-dir build-dma -C Release -R 'sof_(pnp_resources|pinned_owner|telemetry|cng_pin|bdl|dma_owner|stream|rom|glk_boot|ipc|command)' -V
          if ($LASTEXITCODE -ne 0) { throw 'TEST_FAILED' }
      - name: Verify read-only live IRQ collector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_live_irq_tests.ps1
          if (-not $?) { throw 'IRQ_CAPTURE_STATIC_TESTS_FAILED' }
      - name: Verify H6 DeviceAdd ownership guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h6_owner_tests.ps1
          if (-not $?) { throw 'H6_DEVICE_OWNER_STATIC_TESTS_FAILED' }
      - name: Verify H7 firmware source guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h7_firmware_source_tests.ps1
          if (-not $?) { throw 'H7_FIRMWARE_SOURCE_STATIC_TESTS_FAILED' }
      - name: Link H8 KMDF boot driver then destroy SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = (Resolve-Path .\build-dma).Path
          $inspector = Join-Path $build 'Release\phaser360_sof_inspect.exe'
          if (-not (Test-Path -LiteralPath $inspector)) { throw 'H8_INSPECTOR_MISSING' }

          $fixture = Join-Path $build 'fixtures\sof-apl.ri'
          $referenceReport = Join-Path $build 'H8_REFERENCE_CHECK.json'
          python .\scripts\verify-sof-reference.py --inspector $inspector --fixture $fixture --download --report $referenceReport
          if ($LASTEXITCODE -ne 0) { throw 'H8_REFERENCE_VERIFY_FAILED' }

          $generatedDir = Join-Path $build 'h8-generated'
          New-Item -ItemType Directory -Path $generatedDir -Force | Out-Null
          $generated = Join-Path $generatedDir 'embedded_firmware.cpp'
          $firmwareReport = Join-Path $build 'H8_EMBEDDED_FIRMWARE_REPORT.json'
          python .\scripts\generate-embedded-firmware.py --input $fixture --output $generated --report $firmwareReport
          if ($LASTEXITCODE -ne 0) { throw 'H8_PROVIDER_GENERATION_FAILED' }

          $provider = (Resolve-Path -LiteralPath $generated).Path
          msbuild .\m062\driver\phaser360_m1_boot.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:KMDF_VERSION_MAJOR=1 /p:KMDF_VERSION_MINOR=31 /p:TargetVersion=Windows10 /p:SignMode=Off "/p:GeneratedFirmwareSource=$provider" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'H8_DRIVER_LINK_FAILED' }

          $sys = (Resolve-Path .\m062\driver\out-h8\phaser360_m1_boot.sys).Path
          $pe = [IO.File]::ReadAllBytes($sys)
          if ($pe.Length -lt 1024 -or $pe[0] -ne 0x4d -or $pe[1] -ne 0x5a) {
            throw 'H8_DRIVER_PE_INVALID'
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'H9_VSWHERE_MISSING' }
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsRoot) { throw 'H9_VS_INSTALLATION_NOT_FOUND' }
          $dumpbinItem = Get-ChildItem -LiteralPath (Join-Path $vsRoot 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbinItem) { throw 'H9_DUMPBIN_NOT_FOUND' }
          $dumpbinPath = $dumpbinItem.FullName
          Write-Host "H9_DUMPBIN=$dumpbinPath"

          $headers = (& $dumpbinPath /headers $sys 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'H9_DUMPBIN_HEADERS_FAILED' }
          $imports = (& $dumpbinPath /imports $sys 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'H9_DUMPBIN_IMPORTS_FAILED' }

          $headersReport = Join-Path $build 'H9_PE_HEADERS.txt'
          $importsReport = Join-Path $build 'H9_PE_IMPORTS.txt'
          $headers | Set-Content -LiteralPath $headersReport
          $imports | Set-Content -LiteralPath $importsReport

          if ($headers -notmatch '(?im)8664\s+machine\s+\(x64\)') {
            throw 'H9_PE_MACHINE_NOT_X64'
          }
          if ($headers -notmatch '(?im)subsystem\s+\(Native\)') {
            throw 'H9_PE_SUBSYSTEM_NOT_NATIVE'
          }

          foreach ($requiredImport in @(
            'BCryptOpenAlgorithmProvider',
            'BCryptCloseAlgorithmProvider',
            'BCryptCreateHash',
            'BCryptHashData',
            'BCryptFinishHash',
            'BCryptDestroyHash'
          )) {
            if ($imports.IndexOf($requiredImport,[StringComparison]::Ordinal) -lt 0) {
              throw "H9_CNG_IMPORT_MISSING: $requiredImport"
            }
          }

          foreach ($forbiddenImport in @(
            'KERNEL32.dll','USER32.dll','NTDLL.dll','ADVAPI32.dll','BCRYPT.dll',
            'WINMM.dll','MMDEVAPI.dll','AUDIOSES.dll',
            'PORTCLS.SYS','KS.SYS','DRMK.SYS','ACX01000.SYS'
          )) {
            if ($imports.IndexOf($forbiddenImport,[StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "H9_FORBIDDEN_IMPORT: $forbiddenImport"
            }
          }

          $firstHash = (Get-FileHash -LiteralPath $sys -Algorithm SHA256).Hash.ToLowerInvariant()
          $firstBytes = (Get-Item -LiteralPath $sys).Length
          $reproFirst = Join-Path $build 'H10_PE_REPRO_FIRST.json'
          python .\scripts\audit-pe-repro.py --input $sys --report $reproFirst
          if ($LASTEXITCODE -ne 0) { throw 'H10_FIRST_REPRO_MARKER_MISSING' }

          Write-Host "H10_REPRO_FIRST_SHA256=$firstHash"
          Remove-Item -LiteralPath $sys -Force
          if (Test-Path -LiteralPath $sys) { throw 'H10_FIRST_SYS_DELETE_FAILED' }

          msbuild .\m062\driver\phaser360_m1_boot.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:KMDF_VERSION_MAJOR=1 /p:KMDF_VERSION_MINOR=31 /p:TargetVersion=Windows10 /p:SignMode=Off "/p:GeneratedFirmwareSource=$provider" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'H10_SECOND_DRIVER_LINK_FAILED' }

          $sys = (Resolve-Path .\m062\driver\out-h8\phaser360_m1_boot.sys).Path
          $secondHash = (Get-FileHash -LiteralPath $sys -Algorithm SHA256).Hash.ToLowerInvariant()
          $secondBytes = (Get-Item -LiteralPath $sys).Length
          $reproSecond = Join-Path $build 'H10_PE_REPRO_SECOND.json'
          python .\scripts\audit-pe-repro.py --input $sys --report $reproSecond
          if ($LASTEXITCODE -ne 0) { throw 'H10_SECOND_REPRO_MARKER_MISSING' }

          Write-Host "H10_REPRO_SECOND_SHA256=$secondHash"
          if ($firstBytes -ne $secondBytes) {
            throw "H10_REPRO_SIZE_MISMATCH: first=$firstBytes second=$secondBytes"
          }
          if ($firstHash -cne $secondHash) {
            throw "H10_REPRO_HASH_MISMATCH: first=$firstHash second=$secondHash"
          }

          $sysHash = $secondHash
          $sysBytes = $secondBytes
          $metadata = Join-Path $build 'H8_DRIVER_LINK_REPORT.txt'
          @(
            "COMMIT=$env:GITHUB_SHA",
            'H8_DRIVER_LINK=PASS',
            'H9_PE_AUDIT=PASS',
            'H10_REPRODUCIBLE_BUILD=PASS',
            "H10_REPRO_FIRST_SHA256=$firstHash",
            "H10_REPRO_SECOND_SHA256=$secondHash",
            'H10_IMAGE_DEBUG_TYPE_REPRO=PRESENT',
            'PE_MACHINE=X64',
            'PE_SUBSYSTEM=NATIVE',
            'CNG_IMPORTS=REQUIRED_AND_PRESENT',
            'USERMODE_IMPORTS=NONE',
            'AUDIO_IMPORTS=NONE',
            "SYS_SHA256=$sysHash",
            "SYS_BYTES=$sysBytes",
            'SYS_UPLOADED=FALSE',
            'INF=ABSENT',
            'SIGN_MODE=OFF',
            'FIRMWARE_SOURCE=GENERATED_EMBEDDED_PINNED',
            'FIRMWARE_SHA256=40029b5a05665f19a492ef00b8c0a24c42e90d7c00fc57146e07947fd1407d5c',
            'HARDWARE_EXECUTION=NONE',
            'TARGET_OS=WINDOWS10_21H2_19044',
            'KMDF_TARGET=1.31',
            'AUDIO_PLAYBACK=NOT_IMPLEMENTED'
          ) | Set-Content -LiteralPath $metadata

          Write-Host "H8_DRIVER_LINK=PASS; sys_bytes=$sysBytes; sys_sha256=$sysHash; sys_uploaded=FALSE; inf=ABSENT; hardware=NONE; playback=NO"
          Write-Host 'H9_PE_AUDIT=PASS; machine=X64; subsystem=NATIVE; cng_imports=PRESENT; usermode_imports=NONE; audio_imports=NONE; sys_uploaded=FALSE'
          Write-Host "H10_REPRODUCIBLE_BUILD=PASS; sha256=$secondHash; bytes=$secondBytes; image_debug_type_repro=PRESENT; sys_uploaded=FALSE"

          Remove-Item -LiteralPath $sys -Force
          if (Test-Path -LiteralPath $sys) { throw 'H8_SYS_DELETE_FAILED' }
          Remove-Item -LiteralPath $generated -Force
          if (Test-Path -LiteralPath $generated) { throw 'H8_GENERATED_PROVIDER_DELETE_FAILED' }
          Remove-Item -LiteralPath $fixture -Force
          if (Test-Path -LiteralPath $fixture) { throw 'H8_FIRMWARE_FIXTURE_DELETE_FAILED' }

      - name: Verify H8 link-only guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h8_link_only_tests.ps1
          if (-not $?) { throw 'H8_LINK_ONLY_STATIC_TESTS_FAILED' }

      - name: Verify H9 PE audit guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h9_pe_audit_tests.ps1
          if (-not $?) { throw 'H9_PE_AUDIT_STATIC_TESTS_FAILED' }

      - name: Verify H10 reproducible-build guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h10_repro_tests.ps1
          if (-not $?) { throw 'H10_REPRO_STATIC_TESTS_FAILED' }

      - name: Verify H11 read-only telemetry guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h11_telemetry_tests.ps1
          if (-not $?) { throw 'H11_READONLY_TELEMETRY_STATIC_TESTS_FAILED' }
          Write-Host 'H11_READONLY_TELEMETRY_STATIC_TESTS=PASS'

      - name: Verify H12 M1 preflight and recovery guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\m062\m1\Collect-M1Preflight.ps1 -SelfTest
          if (-not $?) { throw 'H12_M1_PREFLIGHT_SELFTEST_FAILED' }
          Write-Host 'H12_M1_PREFLIGHT_SELFTEST=PASS'
          & .\tests\m0615_h12_preflight_tests.ps1
          if (-not $?) { throw 'H12_M1_PREFLIGHT_STATIC_TESTS_FAILED' }
          Write-Host 'H12_M1_PREFLIGHT_STATIC_TESTS=PASS'

      - name: Verify H12.1 Windows 10 KMDF compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h12_1_win10_kmdf_tests.ps1
          if (-not $?) { throw 'H12_1_WIN10_KMDF_COMPAT_FAILED' }
          Write-Host 'H12_1_WIN10_KMDF_COMPAT=PASS'

      - name: Validate H13 exact-target INF package then destroy package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = (Resolve-Path .\build-dma).Path
          $inspector = Join-Path $build 'Release\phaser360_sof_inspect.exe'
          if (-not (Test-Path -LiteralPath $inspector)) { throw 'H13_INSPECTOR_MISSING' }

          $fixture = Join-Path $build 'h13-fixtures\sof-apl.ri'
          $referenceReport = Join-Path $build 'H13_REFERENCE_CHECK.json'
          python .\scripts\verify-sof-reference.py --inspector $inspector --fixture $fixture --download --report $referenceReport
          if ($LASTEXITCODE -ne 0) { throw 'H13_REFERENCE_VERIFY_FAILED' }

          $generatedDir = Join-Path $build 'h13-generated'
          New-Item -ItemType Directory -Path $generatedDir -Force | Out-Null
          $generated = Join-Path $generatedDir 'embedded_firmware.cpp'
          python .\scripts\generate-embedded-firmware.py --input $fixture --output $generated
          if ($LASTEXITCODE -ne 0) { throw 'H13_PROVIDER_GENERATION_FAILED' }
          $provider = (Resolve-Path -LiteralPath $generated).Path

          msbuild .\m062\driver\phaser360_m1_boot.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:KMDF_VERSION_MAJOR=1 /p:KMDF_VERSION_MINOR=31 /p:TargetVersion=Windows10 /p:SignMode=Off "/p:GeneratedFirmwareSource=$provider" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'H13_DRIVER_LINK_FAILED' }

          $sys = (Resolve-Path .\m062\driver\out-h8\phaser360_m1_boot.sys).Path
          $package = Join-Path $build 'h13-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $sys -Destination (Join-Path $package 'phaser360_m1_boot.sys')
          Copy-Item -LiteralPath .\m062\m1\phaser360_m1_boot.inf -Destination (Join-Path $package 'phaser360_m1_boot.inf')

          $searchRoots = @(
            (Join-Path $env:GITHUB_WORKSPACE 'm062\packages'),
            (Join-Path $env:USERPROFILE '.nuget\packages'),
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          $inf2catCandidates = @(
            foreach($root in $searchRoots) {
              Get-ChildItem -LiteralPath $root -Filter Inf2Cat.exe -Recurse -File -ErrorAction SilentlyContinue
            }
          )
          $inf2catItem = $inf2catCandidates |
            Sort-Object @{Expression={ if($_.FullName -match '(?i)\\x64\\'){0}else{1} }},FullName -Descending |
            Select-Object -First 1
          if (-not $inf2catItem) {
            Write-Host ('H13_INF2CAT_SEARCH_ROOTS=' + ($searchRoots -join ';'))
            throw 'H13_INF2CAT_NOT_FOUND'
          }
          $inf2cat = $inf2catItem.FullName
          Write-Host "H13_INF2CAT_PATH=$inf2cat"

          & $inf2cat "/driver:$package" '/os:10_VB_X64' '/uselocaltime' '/verbose'
          if ($LASTEXITCODE -ne 0) { throw 'H13_INF2CAT_FAILED' }

          $cat = Join-Path $package 'phaser360_m1_boot.cat'
          $inf = Join-Path $package 'phaser360_m1_boot.inf'
          $pkgSys = Join-Path $package 'phaser360_m1_boot.sys'
          if (-not (Test-Path -LiteralPath $cat -PathType Leaf)) { throw 'H13_CAT_MISSING' }

          $infHash=(Get-FileHash -LiteralPath $inf -Algorithm SHA256).Hash.ToLowerInvariant()
          $catHash=(Get-FileHash -LiteralPath $cat -Algorithm SHA256).Hash.ToLowerInvariant()
          $sysHash=(Get-FileHash -LiteralPath $pkgSys -Algorithm SHA256).Hash.ToLowerInvariant()
          $report=Join-Path $build 'H13_PACKAGE_REPORT.txt'
          @(
            "COMMIT=$env:GITHUB_SHA",
            'H13_INF2CAT=PASS',
            'H13_OS_SIGNABILITY=10_VB_X64',
            'TARGET_BUILD_EXACT_GATE=19044',
            'TARGET_HWID=PCI\VEN_8086&DEV_3198&SUBSYS_00000000&REV_06',
            'SERVICE=Phaser360M1',
            'SERVICE_START=DEMAND',
            'KMDF_TARGET=1.31',
            "INF_SHA256=$infHash",
            "CAT_SHA256=$catHash",
            "SYS_SHA256=$sysHash",
            'CAT_SIGNED=FALSE',
            'H13_PACKAGE_UPLOADED=FALSE',
            'H13_INSTALL_EXECUTED=FALSE',
            'BASELINE_BACKUP=EXPORT_ONLY_SCRIPT_NOT_EXECUTED_CI',
            'AUDIO_ENDPOINTS=NONE',
            'FILTERS=NONE',
            'PLAYBACK=NO'
          ) | Set-Content -LiteralPath $report
          Write-Host "H13_INF2CAT=PASS; os=10_VB_X64; exact_hwid=YES; kmdf=1.31; package_uploaded=FALSE; install_executed=FALSE; playback=NO"

          Remove-Item -LiteralPath $package -Recurse -Force
          if (Test-Path -LiteralPath $package) { throw 'H13_PACKAGE_DELETE_FAILED' }
          Remove-Item -LiteralPath $sys -Force
          if (Test-Path -LiteralPath $sys) { throw 'H13_SYS_DELETE_FAILED' }
          Remove-Item -LiteralPath $generated -Force
          Remove-Item -LiteralPath $fixture -Force
          if (Test-Path -LiteralPath $generated -or Test-Path -LiteralPath $fixture) {
            throw 'H13_TEMP_INPUT_DELETE_FAILED'
          }

      - name: Verify H13 package guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\m0615_h13_package_tests.ps1
          if (-not $?) { throw 'H13_PACKAGE_STATIC_TESTS_FAILED' }

      - name: Stage development library
        shell: pwsh
        run: |
          New-Item -ItemType Directory _artifact_m062 | Out-Null
